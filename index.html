<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кросворд: міжнародна торгівля товарами та послугами</title>
<style>
:root{--bg:#f3f5f7;--surface:#fff;--ink:#16243a;--muted:#5b6b82;--line:#16243a;--accent:#b8860b;--accent-soft:#f6e7b8;--ok:#1d7a4a;--bad:#b3261e;--blank:#16243a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1826;--surface:#17233a;--ink:#e8edf5;--muted:#9aabc4;--line:#9aabc4;--accent:#e0b13a;--accent-soft:#4a3d14;--ok:#5ad08f;--bad:#ff8a80;--blank:#0f1826}}
:root[data-theme="dark"]{--bg:#0f1826;--surface:#17233a;--ink:#e8edf5;--muted:#9aabc4;--line:#9aabc4;--accent:#e0b13a;--accent-soft:#4a3d14;--ok:#5ad08f;--bad:#ff8a80;--blank:#0f1826}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:0 0 4px;line-height:1.2}
.sub{color:var(--muted);margin:0 0 16px;font-family:system-ui,sans-serif;font-size:.95rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-family:system-ui,sans-serif}
button{font:inherit;font-size:.9rem;padding:8px 14px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:6px;cursor:pointer}
button:hover{background:var(--accent-soft)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
#stat{margin-left:auto;color:var(--muted);font-size:.9rem}
.wrap{overflow-x:auto;padding-bottom:6px;background:var(--surface);border:1.5px solid var(--ink);border-radius:8px;padding:12px}
#grid{display:grid;width:max-content;margin:0 auto}
.cell{width:30px;height:30px;position:relative}
.cell.blank{background:transparent}
.cell.l{background:var(--surface);border:1px solid var(--line);margin:-.5px}
.cell .n{position:absolute;top:0;left:2px;font:9px/1 system-ui,sans-serif;color:var(--muted);pointer-events:none}
.cell input{width:100%;height:100%;border:0;background:transparent;text-align:center;font:600 16px Georgia,serif;color:var(--ink);padding:6px 0 0;text-transform:uppercase;caret-color:transparent;cursor:pointer}
.cell.hl{background:var(--accent-soft)}
.cell.cur{background:var(--accent);}
.cell.cur input{color:#fff}
.cell.ok input{color:var(--ok)}
.cell.bad{background:color-mix(in srgb,var(--bad) 25%,var(--surface))}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
@media(max-width:700px){.clues{grid-template-columns:1fr}}
h2{font-size:1.1rem;margin:0 0 8px;border-bottom:2px solid var(--accent);padding-bottom:4px}
ol{list-style:none;margin:0;padding:0;font-size:.95rem}
li{padding:5px 8px;border-radius:4px;cursor:pointer;display:flex;gap:8px}
li b{min-width:1.8em;color:var(--accent)}
li:hover,li.act{background:var(--accent-soft)}
li.done{color:var(--muted);text-decoration:line-through}
#msg{font-family:system-ui,sans-serif;margin-top:12px;font-weight:600;min-height:1.5em}
</style></head><body><main>
<h1>Кросворд: міжнародна торгівля товарами та послугами</h1>
<p class="sub">Тема 2. Натисніть клітинку або підказку й вводьте літери. Повторне натискання змінює напрям.</p>
<div class="bar"><button id="chk">Перевірити</button><button id="hint">Показати літеру</button><button id="rev">Показати відповіді</button><button id="clr">Очистити</button><span id="stat"></span></div>
<div class="wrap"><div id="grid"></div></div>
<div id="msg" role="status"></div>
<div class="clues"><section><h2>По горизонталі</h2><ol id="ca"></ol></section><section><h2>По вертикалі</h2><ol id="cd"></ol></section></div>
</main>
<script>
const D={"rows": 22, "cols": 20, "words": [{"w": "СПЕЦІАЛІЗАЦІЯ", "clue": "Зосередження країни на виробництві товарів із перевагою", "r": 20, "c": 0, "d": "A", "n": 23}, {"w": "МЕРКАНТИЛІЗМ", "clue": "Теорія, за якою багатство країни — це золото й срібло", "r": 10, "c": 8, "d": "D", "n": 16}, {"w": "ТРУДОМІСТКИЙ", "clue": "Продукт із високою часткою витрат на робочу силу", "r": 10, "c": 3, "d": "A", "n": 15}, {"w": "САМУЕЛЬСОН", "clue": "Американець, що довів теорему вирівнювання цін на фактори (1948)", "r": 3, "c": 10, "d": "D", "n": 7}, {"w": "ПАРАДОКС", "clue": "Тип твердження Леонтьєва, що суперечить теорії", "r": 3, "c": 3, "d": "A", "n": 6}, {"w": "ЛЕОНТЬЄВ", "clue": "Його парадокс не підтвердив теорію Хекшера–Оліна на практиці", "r": 1, "c": 8, "d": "D", "n": 4}, {"w": "ХАБЕРЛЕР", "clue": "Австрійський економіст, співавтор основ стандартної моделі", "r": 1, "c": 3, "d": "A", "n": 3}, {"w": "АВТАРКІЯ", "clue": "Стан економіки без зовнішньої торгівлі", "r": 4, "c": 10, "d": "A", "n": 9}, {"w": "РІКАРДО", "clue": "Автор теорії порівняльних переваг", "r": 0, "c": 14, "d": "D", "n": 2}, {"w": "ВИТРАТИ", "clue": "Зростаючі … заміщення лежать в основі стандартної моделі", "r": 0, "c": 11, "d": "A", "n": 1}, {"w": "ЕДЖУОРТ", "clue": "Ірландський економіст, що заклав основи стандартної моделі", "r": 5, "c": 2, "d": "A", "n": 10}, {"w": "ЕКСПОРТ", "clue": "Вивезення товарів за кордон", "r": 2, "c": 13, "d": "A", "n": 5}, {"w": "КАПІТАЛ", "clue": "Його ціна — процентна ставка", "r": 10, "c": 12, "d": "D", "n": 17}, {"w": "ПОРТЕР", "clue": "Автор теорії конкурентних переваг і національного «ромба»", "r": 6, "c": 13, "d": "A", "n": 12}, {"w": "ЗОЛОТО", "clue": "Основне багатство країни за меркантилістами", "r": 16, "c": 4, "d": "A", "n": 22}, {"w": "ІМПОРТ", "clue": "Ввезення товарів з-за кордону", "r": 13, "c": 5, "d": "D", "n": 21}, {"w": "ХЕКШЕР", "clue": "Шведський економіст, співавтор теорії співвідношення факторів виробництва", "r": 4, "c": 2, "d": "D", "n": 8}, {"w": "РЕНТА", "clue": "Ціна фактора «земля»", "r": 6, "c": 18, "d": "D", "n": 14}, {"w": "ПОПИТ", "clue": "З його боку теорія подібності країн пояснює торгівлю", "r": 12, "c": 12, "d": "A", "n": 19}, {"w": "ЦИКЛ", "clue": "Товар проходить через чотири етапи життєвого … ", "r": 11, "c": 15, "d": "D", "n": 18}, {"w": "РОМБ", "clue": "Схема з чотирьох детермінантів Портера", "r": 6, "c": 15, "d": "D", "n": 13}, {"w": "СМІТ", "clue": "Автор теорії абсолютних переваг", "r": 13, "c": 3, "d": "A", "n": 20}, {"w": "ОЛІН", "clue": "Бертіл …, співавтор теорії Хекшера", "r": 5, "c": 6, "d": "D", "n": 11}]};
const g=document.getElementById('grid');
g.style.gridTemplateColumns='repeat('+D.cols+',30px)';
const cells={};let cur=null,dir='A';
D.words.forEach(w=>{for(let i=0;i<w.w.length;i++){const r=w.r+(w.d==='D'?i:0),c=w.c+(w.d==='A'?i:0),k=r+','+c;
 if(!cells[k])cells[k]={r,c,ch:w.w[i],n:null,w:{}};cells[k].w[w.d]=w;if(i===0)cells[k].n=w.n;}});
const els={};
for(let r=0;r<D.rows;r++)for(let c=0;c<D.cols;c++){const k=r+','+c,d=document.createElement('div');
 if(cells[k]){d.className='cell l';if(cells[k].n)d.insertAdjacentHTML('beforeend','<span class="n">'+cells[k].n+'</span>');
  const i=document.createElement('input');i.maxLength=1;i.autocomplete='off';i.setAttribute('aria-label','Рядок '+(r+1)+', стовпець '+(c+1));
  i.addEventListener('focus',()=>sel(k,false));i.addEventListener('click',()=>sel(k,true));
  i.addEventListener('input',()=>{i.value=i.value.slice(-1).toUpperCase();d.classList.remove('bad','ok');if(i.value)step(k,1);upd();});
  i.addEventListener('keydown',e=>key(e,k));d.appendChild(i);els[k]=d;}
 else d.className='cell blank';g.appendChild(d);}
function inp(k){return els[k]&&els[k].querySelector('input')}
function wordCells(w){const a=[];for(let i=0;i<w.w.length;i++)a.push((w.r+(w.d==='D'?i:0))+','+(w.c+(w.d==='A'?i:0)));return a}
function sel(k,tog){const c=cells[k];if(tog&&cur===k&&c.w.A&&c.w.D)dir=dir==='A'?'D':'A';
 else if(!c.w[dir])dir=c.w.A?'A':'D';cur=k;paint();}
function paint(){Object.values(els).forEach(e=>e.classList.remove('hl','cur'));document.querySelectorAll('li').forEach(l=>l.classList.remove('act'));
 const w=cells[cur].w[dir];wordCells(w).forEach(k=>els[k].classList.add('hl'));els[cur].classList.add('cur');
 const li=document.getElementById('c'+dir+w.n);if(li)li.classList.add('act');}
function step(k,s){const w=cells[k].w[dir];if(!w)return;const a=wordCells(w),i=a.indexOf(k)+s;if(i>=0&&i<a.length){inp(a[i]).focus();}}
function key(e,k){const m={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowDown:[1,0],ArrowUp:[-1,0]}[e.key];
 if(m){e.preventDefault();const c=cells[k];let r=c.r,cc=c.c;for(let t=0;t<D.rows+D.cols;t++){r+=m[0];cc+=m[1];const n=r+','+cc;if(cells[n]){inp(n).focus();break;}}}
 else if(e.key==='Backspace'&&!inp(k).value){e.preventDefault();step(k,-1);}}
function mk(id,list,d){const ol=document.getElementById(id);list.sort((a,b)=>a.n-b.n).forEach(w=>{const li=document.createElement('li');li.id='c'+d+w.n;
 li.innerHTML='<b>'+w.n+'.</b><span>'+w.clue+' ('+w.w.length+')</span>';li.onclick=()=>{dir=d;const k=wordCells(w)[0];inp(k).focus();cur=k;paint();};ol.appendChild(li);});}
mk('ca',D.words.filter(w=>w.d==='A'),'A');mk('cd',D.words.filter(w=>w.d==='D'),'D');
function upd(){let f=0,t=0;Object.keys(cells).forEach(k=>{t++;if(inp(k).value)f++;});
 document.getElementById('stat').textContent='Заповнено '+f+' з '+t;
 D.words.forEach(w=>{const ok=wordCells(w).every(k=>inp(k).value===cells[k].ch);const li=document.getElementById('c'+w.d+w.n);li&&li.classList.toggle('done',ok);});}
document.getElementById('chk').onclick=()=>{let bad=0,empty=0;Object.keys(cells).forEach(k=>{const v=inp(k).value,e=els[k];e.classList.remove('bad','ok');
 if(!v)empty++;else if(v!==cells[k].ch){e.classList.add('bad');bad++;}else e.classList.add('ok');});
 document.getElementById('msg').textContent=bad?('Помилок: '+bad+'. Їх позначено червоним.'):empty?'Помилок немає, але є порожні клітинки: '+empty+'.':'Усе правильно. Кросворд розв’язано!';};
document.getElementById('hint').onclick=()=>{if(!cur)return;const w=cells[cur].w[dir];const k=wordCells(w).find(k=>inp(k).value!==cells[k].ch);if(k){inp(k).value=cells[k].ch;els[k].classList.remove('bad');upd();}};
document.getElementById('rev').onclick=()=>{Object.keys(cells).forEach(k=>{inp(k).value=cells[k].ch;els[k].classList.remove('bad');});upd();document.getElementById('msg').textContent='';};
document.getElementById('clr').onclick=()=>{Object.keys(cells).forEach(k=>{inp(k).value='';els[k].classList.remove('bad','ok');});upd();document.getElementById('msg').textContent='';};
upd();
</script></body></html>
